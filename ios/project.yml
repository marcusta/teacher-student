# XcodeGen project definition — the .xcodeproj is GENERATED and gitignored.
#
# Regenerate after cloning, or whenever this file changes:
#
#     cd ios && xcodegen generate
#
# `sources` is a directory glob, so adding Swift files under TeacherStudent/
# needs no edit here — just re-run the command above.

name: TeacherStudent

options:
  bundleIdPrefix: se.mackans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  TeacherStudent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: TeacherStudent
      # The web client's message catalogs are the single source of truth for
      # copy (PLAN.md §Stack). They are bundled verbatim, never forked.
      - path: ../web/i18n/sv.json
        type: file
        buildPhase: resources
      - path: ../web/i18n/en.json
        type: file
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mackans.teacherstudent
        PRODUCT_NAME: TeacherStudent
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only, portrait first (PLAN.md — phone-shaped product).
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Signing team for on-device installs. Lives here rather than being
        # picked in Xcode's UI: the .xcodeproj is GENERATED, so a team chosen
        # there is wiped by the next `xcodegen generate`.
        DEVELOPMENT_TEAM: AC979WJ4JA
        SWIFT_EMIT_LOC_STRINGS: NO

    # Info.plist contents live here, in the project definition; the plist file
    # itself is generated next to this file and gitignored.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lindgren Equestrian
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        # The dev API runs on plain http://localhost:4810. The exception is
        # scoped to localhost and nothing else — no arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
